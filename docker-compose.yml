services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: autorepoflow
      MYSQL_USER: autorepoflow
      MYSQL_PASSWORD: autorepoflow
      MYSQL_ROOT_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - autorepoflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uautorepoflow", "-pautorepoflow"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  autorepoflow_mysql:
